[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "netblind"
version = "1.0.0"
description = "Per-application outbound firewall for Linux — CLI, TUI, and GUI clients"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "dilates", email = "dilateig@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "rich>=13.0",
    "textual>=0.47",
    "PyGObject>=3.44; sys_platform == 'linux'",
]

[project.urls]
Homepage = "https://github.com/dilates"
Repository = "https://github.com/dilates/netblind"

[project.scripts]
netblind     = "clients.cli.main:main"
netblind-tui = "clients.tui.main:main"
netblind-gui = "clients.gui.main:main"

[tool.hatch.build.targets.wheel]
packages = ["clients"]
